# yaml-language-server: $schema=./serverk.schema.json
schemaVersion: serverk.gg/v1
kind: GamePackage

metadata:
  id: ark
  name:
    ar: آرك سيرفايفل أسندد
    en: "ARK: Survival Ascended"
  description:
    ar: سيرفر آرك سيرفايفل أسندد خاص بك، روّض فيه الديناصورات، وابنِ قاعدتك، وحدّد قوانين الماب بنفسك. لوحة كاملة لكل إعدادات اللعبة، وجدول اللاعبين، ومودات CurseForge، وتبديل المابات، مع RCON جاهز من أول تشغيل.
    en: "Your own ARK: Survival Ascended server. Tame the dinos, raise your base, and set every rule on the map yourself. A full panel for the game settings, the player table, CurseForge mods and map switching, with RCON ready from the first boot."
  tagline:
    ar: روّض أول ديناصور لك مع أصحابك، وسيرفرك جاهز خلال دقائق
    en: Tame your first dino with your friends, on a server ready in minutes
  category: survival
  logo: assets/logo.webp
  banner: assets/banner.webp
  extensions:
    - kind: mods
      sources:
        - curseforge

resources:
  minMemoryMb: 16384
  recommendedMemoryMb: 16384
  minDiskMb: 20480
  playersPerMemoryGb: 4
  maxRecommendedPlayers: 70

container:
  image: serverkgg/ark
  runtime:
    platform: wine
    installBudgetMinutes: 45
    bootBudgetMinutes: 15
    shmMb: 256
    pidsLimit: 512
  ports:
    - key: game
      containerPort: 7777
      protocol: udp
      mirror: true
      name:
        ar: آرك
        en: ARK
      hint:
        ar: ابحث عن اسم سيرفرك في قائمة Unofficial، أو افتح الكونسول داخل اللعبة واكتب open مع العنوان.
        en: Find your server by name under Unofficial, or open the in-game console and type open with the address.
      hostRange:
        default: 9000
        min: 9000
        max: 9099
    - key: rcon
      containerPort: 27020
      protocol: tcp
      name:
        ar: RCON
        en: RCON
      hint:
        ar: للأدوات الخارجية فقط، ولا يدخل منه اللاعبون. يتفعّل عند تشغيل الوصول عن بُعد من اللوحة.
        en: For external tools only, never for players. It works once remote access is turned on in the panel.
      join: separate
      hostRange:
        default: 12500
        min: 12500
        max: 12599
      activeWhen:
        - variable: RCON_EXPOSED
          values:
            - "true"

secrets:
  - key: CURSEFORGE_API_KEY
    description:
      ar: مفتاح CurseForge API. من دونه يتوقف كتالوج مودات آرك، وتبقى إضافة المود برقمه الطريقة الوحيدة.
      en: CurseForge API key. Without it the ARK mod catalog stays off and adding a mod by its ID is the only way.
    required: false

backup:
  only:
    - ShooterGame/Saved/**
    - ShooterGame/Binaries/Win64/BanList.txt
    - ShooterGame/Binaries/Win64/PlayersExclusiveJoinList.txt
    - .serverk-install.json
    - .serverk-mods.json
  except:
    - ShooterGame/Saved/Logs/**
    - ShooterGame/Saved/Crashes/**
    - ShooterGame/Saved/Config/CrashReportClient/**
    - ShooterGame/Saved/SavedArks/**/*_??.??.????_??.??.??.ark

reset:
  keep:
    - .steamcmd
    - .steam
    - .proton
    - .serverk-wine.json
    - steamapps
    - Engine/**
    - ShooterGame/Binaries/**
    - ShooterGame/Content/**
    - ShooterGame/Plugins/**

presence:
  name: player
  id: eosId
  fields:
    - key: eosId
      label:
        ar: معرّف اللاعب
        en: Account id

files:
  protected:
    - .serverk-wine.json
    - .serverk-install.json
    - .serverk-mods.json
  notable:
    - match: ShooterGame/Saved/Config/WindowsServer/GameUserSettings.ini
      label:
        ar: إعدادات اللعبة
        en: Game settings
      icon: settings
      color: "#de9b35"
      restart: true
      note:
        ar: كل قوانين سيرفرك، من PVP والمضاعفات إلى الترويض والبناء. يعيد سيرفرك كتابة هذا الملف من ذاكرته في كل إيقاف، فيضيع أي تعديل يدوي تجريه وهو شغّال. عدّل من تبويب الإعدادات، ونكتب الملف لك قبل كل تشغيل.
        en: Every rule your server runs on, from PVP and the multipliers to taming and building. The server rewrites this file from memory every time it shuts down, so an edit you make by hand while it's up is lost. Change it from the Settings tab and we write it for you before every start.
    - match: ShooterGame/Saved/Config/WindowsServer/Game.ini
      label:
        ar: التزاوج والإنجرامات
        en: Breeding and engrams
      icon: wrench
      color: "#de9b35"
      restart: true
      note:
        ar: هنا مضاعفات التزاوج وتربية الصغار وتعديلات الإنجرامات. يقبل الملف المفتاح نفسه أكثر من مرة، فلا تحذف سطرًا لم تكتبه بنفسك.
        en: This is where the breeding and baby-raising multipliers live, plus the engram overrides. The file legitimately repeats the same key, so never delete a line you didn't write yourself.
    - match: ShooterGame/Saved/SavedArks
      label:
        ar: حفظ ماباتك
        en: Your map saves
      icon: globe
      color: "#4a8fd4"
      note:
        ar: كل ما في سيرفرك داخل هذا المجلد، من الشخصيات والمباني إلى الديناصورات والصناديق، ومجلد لكل ماب. لا تحذفه ولا ترفع ملفات فوقه والسيرفر شغّال، واستخدم النسخ الاحتياطية بدلًا من ذلك.
        en: Everything on your server lives in this folder, from characters and buildings to dinos and boxes, one folder per map. Never delete it or upload over it while the server is up. Use the backups instead.
    - match: ShooterGame/Saved/AllowedCheaterAccountIDs.txt
      label:
        ar: الأدمن
        en: Admins
      icon: shield
      color: "#8a6fd4"
      restart: true
      note:
        ar: معرّفات اللاعبين الذين يصبحون أدمن دون كتابة كلمة مرور. معرّف واحد في كل سطر، والأفضل تعديلها من صفحة اللاعبين.
        en: The account IDs that become admin without typing a password. One ID per line, and the Players page is the better place to edit it.
    - match: ShooterGame/Binaries/Win64/PlayersExclusiveJoinList.txt
      label:
        ar: القائمة البيضاء
        en: Whitelist
      icon: users
      color: "#8a6fd4"
      restart: true
      note:
        ar: عند تفعيل الدخول الحصري، لا يدخل سيرفرك إلا أصحاب الأرقام الموجودة في هذا الملف. رقم واحد في كل سطر.
        en: With exclusive join switched on, only the IDs in this file can enter your server. One ID per line.
    - match: ShooterGame/Saved/Logs
      label:
        ar: السجلات
        en: Logs
      icon: box
      color: "#7a8290"
      note:
        ar: سجلات سيرفرك، ومنها نقرأ الكونسول والأحداث. يكبر حجمها مع الوقت، فاحذفها متى أردت.
        en: Your server logs. This is where the console and the events are read from. They grow over time, so delete them whenever you like.

guideTags:
  - id: start
    name:
      ar: ابدأ من هنا
      en: Start here
  - id: mods
    name:
      ar: المودات
      en: Mods
  - id: maps
    name:
      ar: المابات
      en: Maps
  - id: admin
    name:
      ar: الأدمن
      en: Admin

guides:
  - id: getting-started
    title:
      ar: البدء بسيرفرك
      en: Getting started
    summary:
      ar: شغّل سيرفر آرك، وادخله مع أصحابك، واجعل نفسك أدمن فيه.
      en: Get your ARK server running, join it with your friends, and make yourself admin.
    tags:
      - start
    surfaces:
      - overview
      - setup
    bodyPath:
      ar: guides/getting-started/ar.md
      en: guides/getting-started/en.md
  - id: mods
    title:
      ar: المودات من CurseForge
      en: Mods from CurseForge
    summary:
      ar: ثبّت المودات، ورتّبها، ودع سيرفرك ينزّلها بنفسه.
      en: Install mods, order them, and let your server download them itself.
    tags:
      - mods
    surfaces:
      - panel
    bodyPath:
      ar: guides/mods/ar.md
      en: guides/mods/en.md
  - id: maps
    title:
      ar: المابات والتبديل بينها
      en: Maps and switching between them
    summary:
      ar: المابات الرسمية، ومابات المودات، ومكان حفظ كل ماب، ومتى تعمل وايب.
      en: The official maps, mod maps, where each map's save lives, and when to wipe.
    tags:
      - maps
    surfaces:
      - panel
      - files
      - backups
    bodyPath:
      ar: guides/maps/ar.md
      en: guides/maps/en.md
  - id: admin
    title:
      ar: الأدمن والأوامر
      en: Admin and commands
    summary:
      ar: كلمة مرور الأدمن، والأدمن دون كلمة مرور، وأوامر الكونسول، والحظر.
      en: The admin password, admins without a password, the console commands, and bans.
    tags:
      - admin
    surfaces:
      - panel
      - console
    bodyPath:
      ar: guides/admin/ar.md
      en: guides/admin/en.md
